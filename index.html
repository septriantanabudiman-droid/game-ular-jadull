<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Game Ular Jadul</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
      font-family: monospace;
      flex-direction: column;
      position: relative;
    }
    h1 {
      color: #0f0;
      margin-bottom: 10px;
      font-size: 24px;
      text-align: center;
    }
    canvas {
      background: #000;
      border: 2px solid #0f0;
    }
    #scoreboard {
      margin-top: 10px;
      font-size: 18px;
      color: #0f0;
      display: flex;
      gap: 20px;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      border: 2px solid #f00;
      padding: 20px;
      text-align: center;
      display: none;
    }
    #gameOver h2 {
      color: #f00;
      margin: 0 0 10px;
    }
    #restartBtn {
      background: #0f0;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      font-family: monospace;
    }
    #restartBtn:hover {
      background: #0c0;
    }
    #controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px 60px;
      gap: 5px;
      justify-content: center;
    }
    .btn {
      background: #333;
      color: #0f0;
      font-size: 20px;
      border: 2px solid #0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .btn:active {
      background: #0f0;
      color: #000;
    }
    .empty {
      background: none;
      border: none;
    }
  </style>
</head>
<body>
  <h1>GAME ULAR JADUL BY SIBUDI</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="scoreboard">
    <div id="score">Skor: 0</div>
    <div id="bestScore">Best: 0</div>
  </div>

  <div id="gameOver">
    <h2>Game Over!</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Restart</button>
  </div>

  <div id="controls">
    <div class="empty"></div>
    <div class="btn" id="up">▲</div>
    <div class="empty"></div>
    <div class="btn" id="left">◀</div>
    <div class="empty"></div>
    <div class="btn" id="right">▶</div>
    <div class="empty"></div>
    <div class="btn" id="down">▼</div>
    <div class="empty"></div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const bestScoreElement = document.getElementById("bestScore");
    const gameOverOverlay = document.getElementById("gameOver");
    const finalScoreText = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");

    const box = 20;
    let snake, direction, food, score, game;
    let bestScore = localStorage.getItem("bestScore") || 0;
    bestScoreElement.textContent = "Best: " + bestScore;

    function spawnFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * 20) * box,
          y: Math.floor(Math.random() * 20) * box
        };
      } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
      return newFood;
    }

    function resetGame() {
      snake = [{ x: 9 * box, y: 10 * box }];
      direction = null;
      food = spawnFood();
      score = 0;
      scoreElement.textContent = "Skor: " + score;
      gameOverOverlay.style.display = "none";
      if (game) clearInterval(game);
      game = setInterval(draw, 150);
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
      if (event.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
      if (event.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
      if (event.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
      if (event.code === "Space" && gameOverOverlay.style.display === "block") {
        resetGame();
      }
    });

    restartBtn.addEventListener("click", resetGame);

    document.getElementById("up").addEventListener("click", () => {
      if (direction !== "DOWN") direction = "UP";
    });
    document.getElementById("down").addEventListener("click", () => {
      if (direction !== "UP") direction = "DOWN";
    });
    document.getElementById("left").addEventListener("click", () => {
      if (direction !== "RIGHT") direction = "LEFT";
    });
    document.getElementById("right").addEventListener("click", () => {
      if (direction !== "LEFT") direction = "RIGHT";
    });

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#0f0" : "#0a0";
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
      }

      ctx.fillStyle = "#f00";
      ctx.fillRect(food.x, food.y, box, box);

      if (!direction) return;

      let snakeX = snake[0].x;
      let snakeY = snake[0].y;

      if (direction === "LEFT") snakeX -= box;
      if (direction === "UP") snakeY -= box;
      if (direction === "RIGHT") snakeX += box;
      if (direction === "DOWN") snakeY += box;

      if (snakeX < 0) snakeX = canvas.width - box;
      if (snakeY < 0) snakeY = canvas.height - box;
      if (snakeX >= canvas.width) snakeX = 0;
      if (snakeY >= canvas.height) snakeY = 0;

      let newHead = { x: snakeX, y: snakeY };

      if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
        clearInterval(game);
        finalScoreText.textContent = "Skor akhir: " + score;
        gameOverOverlay.style.display = "block";
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem("bestScore", bestScore);
          bestScoreElement.textContent = "Best: " + bestScore;
        }
        return;
      }

      if (snakeX === food.x && snakeY === food.y) {
        score++;
        scoreElement.textContent = "Skor: " + score;
        food = spawnFood();
      } else {
        snake.pop();
      }

      snake.unshift(newHead);
    }

    resetGame();
  </script>
</body>
</html>
